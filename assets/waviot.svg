<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 30 730 770" width="730" height="770">
  <title>WAVIoT</title>
  <!-- Meter body with a display window (the window is a hole, so the theme colour shows through). -->
  <path fill="#000000" fill-rule="evenodd" d="M200 300h460a60 60 0 0 1 60 60v400a60 60 0 0 1-60 60H260a60 60 0 0 1-60-60V360a60 60 0 0 1 60-60zm60 40h340v200H260z"/>
