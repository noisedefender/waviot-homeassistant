name: "Validate with HACS"

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS validation
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out
        uses: "actions/checkout@v4"
      - name: Validate with the HACS action
        uses: "hacs/action@main"
        with:
          category: "integration"
